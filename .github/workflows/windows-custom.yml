name: Windows TX-advance test build

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Name the custom test installer
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/ {print $2; exit}' CMakeLists.txt | cut -d. -f1-3)
          test -n "$BASE_VERSION"
          echo "version=${BASE_VERSION}-txadv-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      release_channel: "DEVEL"
